name: Check carousels and build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: carousels-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_GITHUB_PAGES: "true"
      AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install existing site dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Next.js site
        run: npm run build
      - name: Install browser check tools on the runner
        run: |
          npm install --prefix "$RUNNER_TEMP/carousel-check" --no-package-lock playwright axe-core
          node "$RUNNER_TEMP/carousel-check/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check static and exported pages
        env:
          NODE_PATH: ${{ runner.temp }}/carousel-check/node_modules
        run: node scripts/check-carousels.mjs
      - name: Check logo interaction and reload stability
        env:
          NODE_PATH: ${{ runner.temp }}/carousel-check/node_modules
        run: node scripts/check-logo.mjs
      - name: Prepare original site for comparison on GitHub
        if: success()
        run: |
          git fetch --no-tags --depth=1 origin "$AUDIT_BASE_SHA"
          mkdir -p "$RUNNER_TEMP/site-before"
          git archive "$AUDIT_BASE_SHA" dist | tar -x -C "$RUNNER_TEMP/site-before"
          # Deployment generates these variants; artwork is unchanged in this PR.
          cp -an dist/images/. "$RUNNER_TEMP/site-before/dist/images/"
      - name: Audit loading and page actions
        if: success()
        env:
          NODE_PATH: ${{ runner.temp }}/carousel-check/node_modules
          AUDIT_ASSERT: "true"
          AUDIT_BASE_DIR: ${{ runner.temp }}/site-before/dist
        run: node scripts/audit-site.mjs
      - name: Save audit measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-audit
          path: |
            site-audit.json
            audit-home-*.png
          if-no-files-found: ignore
