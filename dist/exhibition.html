<!doctype html>
<html lang="ru">
<head><base href="https://xamidulline.github.io/cheshuya/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Выставка — Чешуя</title><meta name="description" content="Выставка — Чешуя. Работы и фотографии из архива художника.">
  <link rel="stylesheet" href="https://raw.githack.com/xamidulline/cheshuya/bba23b612c8128c3827f92883ea83cd5bcaea660/dist/style.css">
<link rel="stylesheet" href="https://raw.githack.com/xamidulline/cheshuya/bba23b612c8128c3827f92883ea83cd5bcaea660/dist/menu-unified.css"><link rel="icon" href="media/cheshuya-figma-logo.svg" type="image/svg+xml"><script defer src="https://raw.githack.com/xamidulline/cheshuya/bba23b612c8128c3827f92883ea83cd5bcaea660/dist/carousel-controller.js"></script><script defer src="https://raw.githack.com/xamidulline/cheshuya/bba23b612c8128c3827f92883ea83cd5bcaea660/dist/header.js"></script><script defer src="https://raw.githack.com/xamidulline/cheshuya/bba23b612c8128c3827f92883ea83cd5bcaea660/dist/exhibition-page.js"></script><link rel="stylesheet" href="https://raw.githack.com/xamidulline/cheshuya/bba23b612c8128c3827f92883ea83cd5bcaea660/dist/gallery-ui.css"><script type="module" src="https://raw.githack.com/xamidulline/cheshuya/bba23b612c8128c3827f92883ea83cd5bcaea660/dist/gallery-viewer.js"></script></head>
<body>
  <main class="zine-page exhibition-page">
    <header class="zine-header">
      <a class="back-icon" href="https://raw.githack.com/xamidulline/cheshuya/preview-gallery-controls/dist/catalog-exhibitions.html" aria-label="Назад">←</a>
      <div class="zine-global-controls"><button class="zine-burger" aria-label="Открыть меню">☰</button></div>
    </header>
    <section class="zine-layout">
      <div class="zine-carousel">
        <div class="zine-slide"><img class="zine-photo" alt=""></div>
        <div class="zine-controls"><button class="prev" aria-label="Предыдущее фото">‹</button><span class="counter"></span><button class="next" aria-label="Следующее фото">›</button></div>
      </div>
      <div class="zine-info">
        <p class="zine-meta">Выставка</p>
        <h1></h1>
        <p class="exhibition-place"></p>
        <nav class="zine-pagination"><a class="back-icon exhibition-prev" href="#" aria-label="Предыдущая выставка">←</a><a class="back-icon exhibition-next" href="#" aria-label="Следующая выставка">→</a></nav>
      </div>
    </section>
  </main>
  
  
<script>document.addEventListener("DOMContentLoaded",()=>{const update=()=>{document.querySelectorAll("a[href]").forEach(link=>{const url=new URL(link.href);if(url.origin==="https://xamidulline.github.io"&&url.pathname.startsWith("/cheshuya/")&&url.pathname.endsWith(".html"))link.href="https://raw.githack.com/xamidulline/cheshuya/preview-gallery-controls/dist/"+url.pathname.slice("/cheshuya/".length)+url.search+url.hash;});};update();new MutationObserver(update).observe(document.body,{childList:true,subtree:true});});</script></body>
</html>
